[package]
name = "lenovo-conservation-scheduler"
version = "1.0.0"
description = "Windows tray app that switches Lenovo Conservation Mode on a schedule"
authors = ["Fajar Windhu Zulfikar"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lenovo_conservation_scheduler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Sends the notifications itself so they carry the app's own AppUserModelID: the notification plugin
# skips that id for an executable that is not installed, and the layer beneath it then reports the
# toast as coming from PowerShell.
tauri-winrt-notification = "0.7"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
winreg = "0.56.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
